<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
  <defs>
    <linearGradient id="bh-footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <linearGradient id="bh-footer-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="20%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1"/>
      <stop offset="80%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>

    <filter id="bh-foot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .bh-foot-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .bh-foot-mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      @keyframes bhPulseLight {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }
      .bh-pulse-dot {
        animation: bhPulseLight 3s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bh-pulse-dot {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="900" height="90" rx="10" fill="url(#bh-footer-bg)"/>
  <rect x="0.5" y="0.5" width="899" height="89" rx="9.5" fill="none" stroke="#451126" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Top Decorative Accent Line -->
  <line x1="60" y1="1" x2="840" y2="1" stroke="url(#bh-footer-rule)" stroke-width="1.5"/>

  <!-- Central Nodes & Rule -->
  <g transform="translate(450, 36)">
    <!-- Center Diamond -->
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#190B12" stroke="#C77B9B" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2.5" fill="#E5B5C7" class="bh-pulse-dot" filter="url(#bh-foot-glow)"/>
    
    <!-- Flanking Hash Marks -->
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#701A3D" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#701A3D" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <!-- Left: Identity Note -->
  <g transform="translate(60, 56)">
    <text x="0" y="0" fill="#E5B5C7" class="bh-foot-text" font-weight="600">BHUVANESH M P</text>
    <text x="135" y="0" fill="#701A3D" class="bh-foot-mono">•</text>
    <text x="150" y="0" fill="#C77B9B" class="bh-foot-mono">CRAFTED FOR PRODUCTION // 2026</text>
  </g>

  <!-- Right: Technical Status -->
  <g transform="translate(680, 56)">
    <circle cx="-12" cy="-4" r="3" fill="#C77B9B" class="bh-pulse-dot"/>
    <text x="0" y="0" fill="#E5B5C7" class="bh-foot-mono">EST. CHENNAI, IN</text>
  </g>
</svg>

