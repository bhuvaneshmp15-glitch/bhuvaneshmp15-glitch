<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <linearGradient id="bh-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="60%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <linearGradient id="bh-card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126"/>
      <stop offset="50%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>

    <filter id="bh-metric-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .bh-card-num {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .bh-card-lbl {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .bh-card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
      }
    </style>
  </defs>

  <rect width="900" height="130" rx="10" fill="url(#bh-card-bg)"/>
  <rect x="0.5" y="0.5" width="899" height="129" rx="9.5" fill="none" stroke="url(#bh-card-border)" stroke-width="1"/>

  <!-- Column 1: Public Repositories -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" fill="#F8F0F3" class="bh-card-num" filter="url(#bh-metric-glow)">9</text>
    <text x="0" y="24" fill="#C77B9B" class="bh-card-lbl">Public Repositories</text>
    <text x="0" y="44" fill="#E5B5C7" class="bh-card-sub" fill-opacity="0.8">Python • TypeScript • Java</text>
  </g>

  <!-- Divider 1 -->
  <line x1="260" y1="25" x2="260" y2="105" stroke="#451126" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Column 2: Academic Standing -->
  <g transform="translate(300, 42)">
    <text x="0" y="0" fill="#F8F0F3" class="bh-card-num" filter="url(#bh-metric-glow)">9.34</text>
    <text x="0" y="24" fill="#C77B9B" class="bh-card-lbl">B.Tech IT CGPA</text>
    <text x="0" y="44" fill="#E5B5C7" class="bh-card-sub" fill-opacity="0.8">R.M.K. Engineering College</text>
  </g>

  <!-- Divider 2 -->
  <line x1="530" y1="25" x2="530" y2="105" stroke="#451126" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Column 3: Hackathon Accolade -->
  <g transform="translate(570, 42)">
    <text x="0" y="0" fill="#F8F0F3" class="bh-card-num" filter="url(#bh-metric-glow)">1st</text>
    <text x="0" y="24" fill="#C77B9B" class="bh-card-lbl">API Heist Champion</text>
    <text x="0" y="44" fill="#E5B5C7" class="bh-card-sub" fill-opacity="0.8">technoVIT'26 • VIT Chennai</text>
  </g>

  <!-- Divider 3 -->
  <line x1="740" y1="25" x2="740" y2="105" stroke="#451126" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Column 4: Cloud Certification -->
  <g transform="translate(770, 42)">
    <text x="0" y="0" fill="#F8F0F3" class="bh-card-num" filter="url(#bh-metric-glow)">OCI</text>
    <text x="0" y="24" fill="#C77B9B" class="bh-card-lbl">AI Foundations</text>
    <text x="0" y="44" fill="#E5B5C7" class="bh-card-sub" fill-opacity="0.8">Oracle Certified Associate</text>
  </g>
</svg>

