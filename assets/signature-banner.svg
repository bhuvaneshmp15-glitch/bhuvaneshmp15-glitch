<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="160">
  <defs>
    <linearGradient id="sig-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#240B1D"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <radialGradient id="sig-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8C1F4B" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sig-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#E5B5C7"/>
    </linearGradient>

    <filter id="sig-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sig-serif {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      .sig-sub {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-style: italic;
      }
      .sig-mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        letter-spacing: 0.12em;
      }
      @keyframes sigPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .sig-pulse-dot {
        animation: sigPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Banner Canvas -->
  <rect width="940" height="160" rx="14" fill="url(#sig-bg)"/>
  <rect width="940" height="160" rx="14" fill="url(#sig-glow)"/>
  <rect x="0.5" y="0.5" width="939" height="159" rx="13.5" fill="none" stroke="#451126" stroke-width="1.2"/>

  <!-- Top Accent Shimmer Line -->
  <line x1="80" y1="1" x2="860" y2="1" stroke="#701A3D" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Center Decorative Flanking Diamonds -->
  <g transform="translate(470, 36)">
    <!-- Flanking Hash Lines -->
    <line x1="-180" y1="0" x2="-80" y2="0" stroke="#701A3D" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="80" y1="0" x2="180" y2="0" stroke="#701A3D" stroke-width="1" stroke-dasharray="3 4"/>
    
    <!-- Left Diamond -->
    <rect x="-64" y="-3.5" width="7" height="7" transform="rotate(45 -60.5 0)" fill="#701A3D"/>
    <!-- Right Diamond -->
    <rect x="57" y="-3.5" width="7" height="7" transform="rotate(45 60.5 0)" fill="#701A3D"/>
  </g>

  <!-- Center Big Signature Name -->
  <g transform="translate(470, 78)">
    <text x="0" y="0" text-anchor="middle" fill="url(#sig-text-grad)" class="sig-serif" font-size="44" filter="url(#sig-blur)">
      Bhuvanesh M P
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(470, 108)">
    <text x="0" y="0" text-anchor="middle" fill="#E5B5C7" class="sig-sub" font-size="14">
      Building systems that can explain themselves.
    </text>
  </g>

  <!-- Bottom Micro Technical Tag -->
  <g transform="translate(470, 134)">
    <text x="0" y="0" text-anchor="middle" fill="#C77B9B" class="sig-mono" font-size="9" font-weight="600">
      ENGINEERING INTELLIGENCE <tspan fill="#701A3D">•</tspan> DESIGNING EXPERIENCES <tspan fill="#701A3D">•</tspan> 2026
    </text>
  </g>
</svg>
