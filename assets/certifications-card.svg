<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="100%" height="270">
  <defs>
    <linearGradient id="crt-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140710"/>
      <stop offset="60%" stop-color="#1C0916"/>
      <stop offset="100%" stop-color="#12060E"/>
    </linearGradient>

    <style>
      .crt-num {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 9px;
        fill: #C77B9B;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .crt-title {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-size: 17px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: -0.01em;
      }
      .crt-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #E5B5C7;
      }
      .crt-date {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 9.5px;
        fill: #701A3D;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- ================= ROW 1 ================= -->

  <!-- Card 1: OCI -->
  <g transform="translate(0, 0)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">01 // ORACLE CLOUD</text>
    <text x="20" y="54" class="crt-title">OCI AI Foundations</text>
    <text x="20" y="78" class="crt-body">Oracle Certified Associate</text>
    <text x="20" y="98" class="crt-date">VALID: JUL 2026 – JUL 2028</text>
  </g>

  <!-- Card 2: Infosys -->
  <g transform="translate(321, 0)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">02 // INFOSYS SPRINGBOARD</text>
    <text x="20" y="54" class="crt-title">Software Engineering</text>
    <text x="20" y="78" class="crt-body">Agile, Scrum &amp; Testing Principles</text>
    <text x="20" y="98" class="crt-date">ISSUED: SEPTEMBER 2025</text>
  </g>

  <!-- Card 3: NPTEL -->
  <g transform="translate(642, 0)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">03 // NPTEL • IIT KHARAGPUR</text>
    <text x="20" y="54" class="crt-title">Soft Skill Development</text>
    <text x="20" y="78" class="crt-body">Technical Communication &amp; Collaboration</text>
    <text x="20" y="98" class="crt-date">COMPLETED: JAN – MAR 2026</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Card 4: Codtech -->
  <g transform="translate(0, 140)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">04 // CODTECH IT SOLUTIONS</text>
    <text x="20" y="54" class="crt-title">Python Intern Certificate</text>
    <text x="20" y="78" class="crt-body">RAG Chatbot, Voice Assistant &amp; Briefings</text>
    <text x="20" y="98" class="crt-date">MAY 2026 – JUN 2026</text>
  </g>

  <!-- Card 5: Cognifyz -->
  <g transform="translate(321, 140)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">05 // COGNIFYZ TECHNOLOGIES</text>
    <text x="20" y="54" class="crt-title">Full Stack Internship</text>
    <text x="20" y="78" class="crt-body">Web Development &amp; Modular Architecture</text>
    <text x="20" y="98" class="crt-date">OCT 2025 – NOV 2025</text>
  </g>

  <!-- Card 6: API Heist -->
  <g transform="translate(642, 140)">
    <rect width="298" height="120" rx="10" fill="url(#crt-card-bg)"/>
    <rect x="0.5" y="0.5" width="297" height="119" rx="9.5" fill="none" stroke="#451126" stroke-width="1.2"/>
    <text x="20" y="26" class="crt-num">06 // TECHNOVIT'26 • VIT CHENNAI</text>
    <text x="20" y="54" class="crt-title">API Heist — 1st Place</text>
    <text x="20" y="78" class="crt-body">National Algorithmic Challenge Winner</text>
    <text x="20" y="98" class="crt-date">ACCOLADE: SEPTEMBER 2026</text>
  </g>
</svg>
